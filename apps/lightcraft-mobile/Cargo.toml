[package]
name = "lightcraft-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft Mobile: a touch-first photo editor on the LightCraft pipeline, compiled to WASM for the Android app (build with `cargo xtask mobile`)"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# Feature list copied from apps/lightcraft-web (same web-sys 0.3.106): only the APIs
# ui/host.rs and ui/storage.rs actually use (picker, OPFS, IndexedDB, download export).
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomStringList",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Navigator",
    "Node",
    "Event",
    "Performance",
    # Web Share API file payload is built as a plain JS object via Reflect
    # (web_sys::ShareData needs unstable APIs), used by ui/host.rs.
    "FilePropertyBag",
    "StorageManager",
    "Url",
    "Window",
] }

[features]
# Open HEIC/HEIF photos (see apps/lightcraft-web: the distributor's call because of HEVC patents).
heif = ["lightcraft-codecs/heif"]

[dev-dependencies]
lightcraft-scenes = { workspace = true }
