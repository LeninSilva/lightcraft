<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The zoom lock below is intentional: page pinch-zoom would fight
       the canvas gestures the editor uses, so the page itself does not zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LightCraft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="description" content="LightCraft Mobile: a touch-first photo editor, running on your phone.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141414; }
    /* The canvas is inset by the safe area (top inset at minimum) so
       egui panels do not sit under a notch, cutout, or gesture bar.
       Width/height subtract the insets, so the canvas still fills
       exactly the visible area. The dark background matches the page,
       so first launch has no white flash before the first frame. */
    canvas#lightcraft_canvas {
      position: absolute;
      top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; background: #141414;
    }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9c9c9c; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    /* An error shown in the loading overlay carries a real button: it
       must receive pointer events even though the overlay itself does not. */
    #lightcraft_loading button {
      pointer-events: auto; font: inherit; padding: 10px 18px; border-radius: 10px;
      border: 1px solid #3a3a3a; background: #262626; color: #eee;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start } from "./lightcraft_mobile.js";
    (async () => {
      // Streaming compile needs the right MIME type; a host that serves
      // .wasm as application/octet-stream makes it reject a valid module,
      // so fall back to fetching the bytes and compiling them directly.
      // The served Content-Type is stashed on window for the ?debug=1
      // probe in the wasm module; reading headers consumes nothing, and
      // passing the Response (not a promise) to compileStreaming is
      // equivalent. Loading text is unchanged.
      let module;
      let wasmContentType = null;
      try {
        const res = await fetch("./lightcraft_mobile_bg.wasm");
        try { wasmContentType = res.headers.get("content-type"); } catch (_) {}
        module = await WebAssembly.compileStreaming(res);
      } catch (_) {
        const res = await fetch("./lightcraft_mobile_bg.wasm");
        try { wasmContentType = res.headers.get("content-type"); } catch (_) {}
        module = await WebAssembly.compile(await res.arrayBuffer());
      }
      window.__lightcraftWasmContentType = wasmContentType;
      await init({ module_or_path: module });
      start();
    })().catch((e) => {
      // Detail stays in the console; the screen shows a short message
      // and a Retry button that really reloads the page.
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (!el) return;
      el.textContent = "LightCraft failed to load.";
      el.style.pointerEvents = "auto";
      el.style.flexDirection = "column";
      el.style.gap = "12px";
      const btn = document.createElement("button");
      btn.textContent = "Retry";
      btn.addEventListener("click", () => location.reload());
      el.appendChild(btn);
    });
  </script>
  <script>
    // Installability: register the app-shell service worker only where
    // service workers are allowed (https, or localhost for testing),
    // with a relative script URL and scope so the app also works under
    // a subpath. Any failure is silent: no error UI, and the app still
    // loads from the network. This does not touch the loading overlay,
    // the panic hook, or the ?debug=1 probe, which live in the module
    // above and in the wasm module.
    (function () {
      try {
        if (!("serviceWorker" in navigator)) return;
        // The Android shell (Capacitor) serves its bundled assets from a
        // local https://localhost origin, so the secure-origin check alone
        // would register the worker inside the APK too. There the shell
        // files are already local, and a cache-first worker could keep
        // serving the previous build after an APK update, so skip it.
        if (typeof window !== "undefined" && window.Capacitor) return;
        var secure = location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
        if (!secure) return;
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .catch(function () {});
      } catch (_) {}
    })();
  </script>
</body>
</html>
