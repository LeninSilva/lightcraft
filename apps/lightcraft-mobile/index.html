<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The zoom lock below is intentional: page pinch-zoom would fight
       the canvas gestures the editor uses, so the page itself does not zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1c">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft Mobile: a touch-first photo editor, running on your phone.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    /* The canvas is inset by the safe area (top inset at minimum) so
       egui panels do not sit under a notch, cutout, or gesture bar.
       Width/height subtract the insets, so the canvas still fills
       exactly the visible area. The dark background matches the page,
       so first launch has no white flash before the first frame. */
    canvas#lightcraft_canvas {
      position: absolute;
      top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; background: #1c1c1c;
    }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start } from "./lightcraft_mobile.js";
    (async () => {
      // Streaming compile needs the right MIME type; a host that serves
      // .wasm as application/octet-stream makes it reject a valid module,
      // so fall back to fetching the bytes and compiling them directly.
      let module;
      try {
        module = await WebAssembly.compileStreaming(fetch("./lightcraft_mobile_bg.wasm"));
      } catch (_) {
        const res = await fetch("./lightcraft_mobile_bg.wasm");
        module = await WebAssembly.compile(await res.arrayBuffer());
      }
      await init({ module_or_path: module });
      start();
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>
</body>
</html>
