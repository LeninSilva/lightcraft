<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft Mobile: a touch-first photo editor, running on your phone.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start } from "./lightcraft_mobile.js";
    (async () => {
      const module = await WebAssembly.compileStreaming(fetch("./lightcraft_mobile_bg.wasm"));
      await init({ module_or_path: module });
      start();
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>
</body>
</html>
