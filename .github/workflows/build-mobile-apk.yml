name: Build LightCraft Mobile APK

# Fork-only APK build for the touch-first mobile app (apps/lightcraft-mobile),
# on branch claude/lightcraft-android-apk-nk14le.
# Builds the mobile WASM bundle with `cargo xtask mobile`, then bundles the
# static output offline in a Capacitor Android shell and uploads a debug APK.
# This workflow does not touch the desktop-port build in build-android-apk.yml
# (branch android-apk, artifact lightcraft-android-apk).
# Debug APK: sideload only, not Play Store signed.
# Capacitor is pinned: exact versions in package.json at the repo root,
# installed with --save-exact below (no package-lock.json is committed),
# and the shell is built against the committed capacitor.config.json.
# Do NOT reintroduce `npx cap init`: it merges/rewrites that config
# depending on CLI version, so the workflow uses `cap add` + `cap sync`.

on:
  push:
    branches: [claude/lightcraft-android-apk-nk14le]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.95 + wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The wasm build is the only Rust step; keep the cache keyed on it.
          cache-targets: true

      - name: Run mobile native tests
        run: cargo test -p lightcraft-mobile

      # Advisory only (no -D warnings): clippy must not fail a build that the
      # tests pass, and it cannot see wasm-only code on this native target;
      # the wasm build below is the check for that code.
      - name: Clippy the mobile crate
        continue-on-error: true
        run: cargo clippy -p lightcraft-mobile --all-targets

      - name: Install wasm-bindgen-cli (exact version pinned by the repo)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      # wasm-opt is required, not optional: `cargo xtask mobile` silently
      # keeps the unoptimized module when wasm-opt is absent or fails, so
      # the build must fail here if the binary is missing. (The in-xtask
      # failure swallow still stands; a one-line xtask change is needed
      # to hard-fail on a wasm-opt error itself. Presence is enforced
      # here, and the size assertion below catches gross bloat.)
      - name: Install binaryen (wasm-opt) and require it
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build the mobile app
        run: cargo xtask mobile

      - name: Check the mobile output
        run: |
          test -f target/mobile-site/index.html
          test -f target/mobile-site/lightcraft_mobile_bg.wasm
          test -f target/mobile-site/lightcraft_mobile.js
          WASM_SIZE="$(stat -c%s target/mobile-site/lightcraft_mobile_bg.wasm)"
          echo "wasm bytes: ${WASM_SIZE}"
          test "${WASM_SIZE}" -gt 1000000
          # No mobile wasm size has been recorded from a real build, so
          # the upper bound is a generous sanity cap only (the desktop
          # web wasm was about 13.5 MB); it catches catastrophic bloat,
          # not a missed optimization pass.
          test "${WASM_SIZE}" -lt 40000000
          ls -lh target/mobile-site/

      # Preserve the prebuilt static bundle for deployment (Vercel).
      # Vercel's git import cannot build this Rust/WASM workspace, so the
      # bundle is deployed prebuilt from this artifact, not from source.
      # The .gz/.br copies are excluded: Vercel serves compression itself,
      # and they would only inflate the upload.
      - name: Upload mobile web bundle
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-mobile-web
          path: |
            target/mobile-site/index.html
            target/mobile-site/lightcraft_mobile.js
            target/mobile-site/lightcraft_mobile_bg.wasm
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node 22 and Java 21
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www resources
          cp -r target/mobile-site/. www/
          # cargo xtask mobile also writes .gz/.br copies of every bundle file.
          # Android's asset merger treats foo.js and foo.js.gz as duplicate
          # resources and fails mergeDebugAssets, so drop the precompressed
          # copies here. The plain files are what the WebView loads.
          rm -f www/*.gz www/*.br
          cp assets/app-icon/lightcraft-1024.png resources/icon.png
          test -f www/lightcraft_mobile_bg.wasm
          test -z "$(find www \( -name '*.gz' -o -name '*.br' \))"

      - name: Install Capacitor and create the Android shell
        run: |
          # Exact pins (Capacitor 8.6.0 core/cli/android, assets 3.0.5),
          # matching the committed package.json. No `npx cap init`: the
          # committed capacitor.config.json already holds appId/appName/
          # webDir/scheme/splash settings, and `cap add` reads it.
          npm install --save-exact @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/assets@3.0.5 @capacitor/filesystem@8.1.5 @capacitor/share@8.0.3 @capacitor/splash-screen@8.0.2
          npx cap add android
          npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#f2a516' --splashBackgroundColor '#1c1c1c'
          # Same Kotlin stdlib duplicate fix as the desktop-port APK build.
          printf '\nconfigurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7" }\nconfigurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }\n' >> android/app/build.gradle
          npx cap sync

      # Every build must be distinguishable on the device: versionCode from
      # the run number, versionName from the short commit SHA. Fail loudly
      # if the template layout ever changes and the replacements miss.
      - name: Set APK version from run number and commit
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]*=?[[:space:]]*[0-9]+/\1versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]*=?[[:space:]]*\"[^\"]*\"/\1versionName \"${SHORT_SHA}\"/" android/app/build.gradle
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" android/app/build.gradle
          grep -q "versionName \"${SHORT_SHA}\"" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Check FileProvider paths cover the share cache
        run: |
          test -f android/app/src/main/res/xml/file_paths.xml
          grep -q 'cache-path' android/app/src/main/res/xml/file_paths.xml
          cat android/app/src/main/res/xml/file_paths.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # The APK is only useful if the mobile bundle actually made it into
      # the WebView assets: fail here, not on a phone, if the wasm or the
      # entry page is missing from assets/public/.
      - name: Check the APK contains the mobile bundle
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/lightcraft_mobile_bg.wasm'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/lightcraft_mobile.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/index.html'

      - uses: actions/upload-artifact@v4
        with:
          name: lightcraft-mobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
